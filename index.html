<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title> </title>
<style>
  *,
  *::before,
  *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    -webkit-text-size-adjust: 100%;
  }

  body {
    min-height: 100vh;
    min-height: 100svh;

    display: grid;
    place-items: center;

    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);

    background: #ffffff;
    color: #1d1d1f;

    text-align: center;

    font-family: ui-serif, "New York", "Iowan Old Style", Georgia,
                 "Times New Roman", serif;
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 0.02em;
    line-height: 1.4;

    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;

    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }

  .hello {
    opacity: 0;
    transform: translateY(6px);
    animation: appear 1.4s cubic-bezier(0.22, 0.61, 0.36, 1) 0.15s forwards;
  }

  @keyframes appear {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .hello {
      opacity: 1;
      transform: none;
      animation: none;
    }
  }
</style>
</head>
<body>
  <p class="hello">You deserve better than a liar.<br><br>I'm sorry.<br><br>Please be happy.</p>
</body>
</html>
